[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simracing-engineer"
version = "0.1.0"
description = "Cockpit dashboard for sim racing games with GT7 telemetry support"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4",
    "pycryptodome>=3.20",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
simracing-engineer = "simracing.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simracing"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
