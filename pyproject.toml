[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim-race-engineer"
version = "0.1.0"
description = "Cockpit dashboard for sim racing games with GT7 telemetry support"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4",
    "pycryptodome>=3.20",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
voice = [
    "piper-tts>=1.2.0",
]
analysis = [
    "plotly>=5.20",
    "dash>=2.17",
]
advisor = [
    "ollama>=0.4",
    "anthropic>=0.30",
    "openai>=1.0",
]

[project.scripts]
sim-race-engineer = "simraceengineer.main:main"
sim-race-analyze   = "simraceengineer.analysis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simraceengineer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
